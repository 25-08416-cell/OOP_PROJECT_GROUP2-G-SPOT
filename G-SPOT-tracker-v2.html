<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>G SPOT Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: landing and auth pages are centered single screens; the signed-in app is a navy sidebar plus a card grid that collapses to a top bar and one column on phones. */
:root {
  --bg: #F7F4FB;
  --surface: #FFFFFF;
  --soft: #F4F0FA;
  --ink: #25214A;
  --muted: #6B6890;
  --line: #E9E4F3;
  --navy: #26224C;
  --navy-muted: #B9B5DA;
  --pink: #D1346F;
  --on-pink: #FFFFFF;
  --pink-text: #D1346F;
  --pink-soft: #FDE9F2;
  --violet: #7A4FD0;
  --teal: #1B9A86;
  --mint: #E0F5EE;
  --mint-ink: #17745A;
  --amber-bg: #FFF3D9;
  --amber-ink: #86560A;
  --red-bg: #FDE6EA;
  --red-ink: #B3213F;
  --g1: #F6BCD7;
  --g2: #D0BCF3;
  --g3: #B9EBDD;
  --gc1: #D93B79;
  --gc2: #7A4FD0;
  --float: #FFFFFF;
  --shadow: 0 1px 2px rgba(38,34,76,.05), 0 10px 28px -14px rgba(38,34,76,.2);
  --font-display: 'Plus Jakarta Sans', 'Avenir Next', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14112B; --surface: #1E1A3D; --soft: #28234D; --ink: #F2EEFF; --muted: #AAA5CF; --line: #35305E;
    --navy: #0E0B24; --navy-muted: #A9A4CC;
    --pink: #FF7DAE; --on-pink: #1B1033; --pink-text: #FF8DB7; --pink-soft: #3A1F3F;
    --violet: #A98BF0; --teal: #4FD0B8;
    --mint: #153A33; --mint-ink: #6FE0B8; --amber-bg: #3C2E10; --amber-ink: #F2C56B; --red-bg: #46182A; --red-ink: #FF9AB0;
    --g1: #8C3C6A; --g2: #5A3F99; --g3: #2B6F66; --gc1: #C2306B; --gc2: #5F3DB4;
    --float: #272250; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14112B; --surface: #1E1A3D; --soft: #28234D; --ink: #F2EEFF; --muted: #AAA5CF; --line: #35305E;
  --navy: #0E0B24; --navy-muted: #A9A4CC;
  --pink: #FF7DAE; --on-pink: #1B1033; --pink-text: #FF8DB7; --pink-soft: #3A1F3F;
  --violet: #A98BF0; --teal: #4FD0B8;
  --mint: #153A33; --mint-ink: #6FE0B8; --amber-bg: #3C2E10; --amber-ink: #F2C56B; --red-bg: #46182A; --red-ink: #FF9AB0;
  --g1: #8C3C6A; --g2: #5A3F99; --g3: #2B6F66; --gc1: #C2306B; --gc2: #5F3DB4;
  --float: #272250; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.6);
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
*, *::before, *::after { box-sizing: border-box; }
#root { min-height: 100%; display: flex; flex-direction: column; }
#root > * { flex: 1 0 auto; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:disabled { cursor: not-allowed; opacity: .55; }
:focus-visible { outline: 2px solid var(--pink-text); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; line-height: 1.2; }
h3 { font-weight: 700; font-size: 15px; }
.muted { color: var(--muted); }
.cap { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
.logo { font-family: var(--font-display); font-weight: 800; letter-spacing: .02em; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 14px; padding: 11px 18px; border-radius: 10px; white-space: nowrap; }
.btn.pink { background: var(--pink); color: var(--on-pink); }
.btn.pill { border-radius: 999px; padding: 13px 24px; }
.btn.navy { background: var(--navy); color: #fff; }
.btn.line { border: 1.5px solid var(--ink); color: var(--ink); background: transparent; }
.btn.soft { background: var(--soft); color: var(--ink); }
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn.block { width: 100%; }
.link { color: var(--pink-text); font-weight: 700; font-size: 13px; }
.link.del { color: var(--red-ink); }
.link:hover { text-decoration: underline; }

/* forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-size: 13px; font-weight: 700; }
input:not([type="radio"]):not([type="checkbox"]), select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 13px; width: 100%; min-width: 0;
}
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--pink-text); outline-offset: 1px; border-color: transparent; }
input.invalid, select.invalid { border-color: var(--red-ink); }
.err { background: var(--red-bg); color: var(--red-ink); font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 8px; }
.form { display: flex; flex-direction: column; gap: 14px; }
.hint { font-size: 12.5px; color: var(--muted); }

/* cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.grad { background: linear-gradient(120deg, var(--gc1), var(--gc2)); color: #fff; border: 0; }
.grad .cap { opacity: .85; }

/* ---------- landing ---------- */
.land { background: var(--surface); min-height: 100%; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 32px); }
.l-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px; }
.l-nav .logo { font-size: 20px; }
.l-links { display: flex; align-items: center; gap: clamp(14px, 3vw, 28px); font-weight: 600; font-size: 14px; }
.l-links .plain:hover { color: var(--pink-text); }
.l-links .btn { padding: 10px 20px; }
@media (max-width: 560px) { .l-links .hide-s { display: none; } }
.hero { display: grid; gap: 36px; align-items: center; padding-block: 28px 32px; }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 56px; } }
.badge { display: inline-block; padding: 6px 12px; border-radius: 999px; background: var(--pink-soft); color: var(--pink-text); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.hero h1 { font-size: clamp(36px, 5.4vw, 58px); margin-top: 18px; }
.hero h1 em { font-style: normal; color: var(--pink-text); }
.lede { margin-top: 18px; max-width: 46ch; color: var(--muted); font-size: 16px; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.hero-panel { border-radius: 28px; min-height: 340px; padding: clamp(18px, 4vw, 32px); background: linear-gradient(135deg, var(--g1) 0%, var(--g2) 55%, var(--g3) 100%); display: flex; flex-direction: column; justify-content: center; gap: 16px; }
.float { background: var(--float); border-radius: 14px; padding: 16px 18px; box-shadow: 0 14px 30px -16px rgba(38,34,76,.45); }
.float .cap, .float .big, .float .sm { display: block; }
.float .cap { margin-bottom: 4px; }
.float .big { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.1; }
.float .sm { font-size: 13px; color: var(--muted); }
.f1 { width: min(78%, 300px); }
.f2 { width: min(66%, 260px); align-self: flex-end; }
.f2 .big { font-size: 20px; }
.f3 { width: min(68%, 270px); background: var(--navy); color: #fff; }
.f3 .big { font-size: 18px; }
.bar { height: 6px; border-radius: 4px; background: var(--line); margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--pink); }
.feats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; padding-block: 8px 44px; }
.feat { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; background: var(--surface); }
.feat p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.how { padding-block: 24px 48px; border-top: 1px solid var(--line); }
.how h2 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 22px; }
.step { background: var(--soft); border-radius: 16px; padding: 20px; }
.step .n { width: 34px; height: 34px; border-radius: 50%; background: var(--pink); color: var(--on-pink); display: grid; place-items: center; font-weight: 800; margin-bottom: 12px; }
.step p { color: var(--muted); font-size: 14px; margin-top: 4px; }
.foot { padding-block: 22px 40px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); max-width: 80ch; }

/* ---------- auth ---------- */
.auth { min-height: 100%; display: grid; place-items: center; padding: clamp(16px, 4vw, 32px); }
.auth-card { width: min(940px, 100%); background: var(--surface); border-radius: 24px; overflow: hidden; box-shadow: var(--shadow); display: grid; border: 1px solid var(--line); }
@media (min-width: 780px) { .auth-card { grid-template-columns: 1fr 1fr; min-height: 520px; } }
.auth-art { background: linear-gradient(150deg, var(--g1) 0%, var(--g2) 55%, var(--g3) 100%); padding: clamp(22px, 4vw, 40px); display: flex; flex-direction: column; justify-content: space-between; gap: 24px; min-height: 220px; color: #26224C; }
.auth-art .logo { font-size: 20px; }
.auth-art h1 { font-size: clamp(28px, 4vw, 38px); }
.auth-art p { margin-top: 10px; max-width: 32ch; font-size: 14px; }
.auth-form { padding: clamp(22px, 4vw, 44px); display: flex; flex-direction: column; justify-content: center; gap: 14px; min-width: 0; }
.auth-form h2 { font-size: 24px; font-weight: 800; }
.demo-box { background: var(--soft); border-radius: 12px; padding: 12px 14px; font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.role { position: relative; }
.role input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.role span { display: block; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font-weight: 700; font-size: 13.5px; text-align: center; }
.role input:checked + span { border-color: var(--pink-text); background: var(--pink-soft); color: var(--pink-text); }
.role input:focus-visible + span { outline: 2px solid var(--pink-text); outline-offset: 2px; }

/* ---------- app shell ---------- */
.shell { display: grid; grid-template-columns: minmax(0, 1fr); min-height: 100%; }
.side { background: var(--navy); color: #fff; padding: 16px; display: grid; grid-template-areas: 'brand out' 'nav nav'; grid-template-columns: 1fr auto; align-items: center; gap: 14px 12px; min-width: 0; }
.brand-btn { grid-area: brand; text-align: left; display: flex; flex-direction: column; gap: 2px; }
.brand-btn .logo { font-size: 20px; color: #fff; }
.brand-btn .sub { font-size: 12px; color: var(--navy-muted); }
.logout { grid-area: out; color: var(--navy-muted); font-weight: 600; font-size: 13px; padding: 8px 10px; border-radius: 8px; }
.logout:hover { color: #fff; background: rgba(255,255,255,.08); }
.snav { grid-area: nav; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.snav button { padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; color: rgba(255,255,255,.8); white-space: nowrap; text-align: left; }
.snav button:hover { background: rgba(255,255,255,.08); }
.snav button[aria-current="page"] { background: var(--pink); color: var(--on-pink); }
@media (min-width: 900px) {
  .shell { grid-template-columns: 232px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; align-items: stretch; gap: 22px; padding: 24px 16px; }
  .brand-btn { order: 1; }
  .snav { order: 2; flex-direction: column; overflow: visible; }
  .logout { order: 3; margin-top: auto; text-align: left; }
}
.main { padding: 22px clamp(16px, 3vw, 36px) 56px; display: flex; flex-direction: column; gap: 18px; min-width: 0; max-width: 1120px; width: 100%; }
.pagehead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.pagehead h1 { font-size: clamp(24px, 3vw, 30px); }
.pagehead .sub { color: var(--muted); margin-top: 4px; }
.sample { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 14px; border-radius: 12px; background: var(--amber-bg); color: var(--amber-ink); font-size: 13.5px; font-weight: 600; }
.sample span { flex: 1 1 240px; min-width: 0; }
.sample .link { color: var(--amber-ink); text-decoration: underline; }

.dgrid { display: grid; gap: 16px; }
.dgrid > * { min-width: 0; }
@media (min-width: 900px) { .dgrid { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); } }
.prog h2, .prog .wk { color: #fff; }
.wkrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-top: 6px; }
.wk { font-family: var(--font-display); font-weight: 800; font-size: clamp(36px, 5vw, 46px); line-height: 1.05; letter-spacing: -0.02em; }
.tri { font-weight: 700; font-size: 15px; opacity: .92; }
.prog .due { margin-top: 12px; font-weight: 600; font-size: 14px; }
.prog .bar { background: rgba(255,255,255,.3); height: 8px; margin-top: 14px; }
.prog .bar i { background: #fff; }
.prog .size { margin-top: 10px; font-size: 14px; font-weight: 600; opacity: .95; }
.appt-next h2 { font-size: 22px; font-weight: 800; margin-top: 6px; }
.appt-next .when { margin-top: 4px; font-weight: 600; font-size: 14px; }
.appt-next .rem { margin-top: 10px; color: var(--muted); font-size: 13.5px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 10px; margin-top: 14px; }
.tile { background: var(--soft); border-radius: 12px; padding: 12px; }
.tile .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.tile .v { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.2; margin-top: 2px; }
.tile .d { font-size: 11.5px; color: var(--muted); }
.mini-list { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; }
.mini-list li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.mini-list li span:last-child { color: var(--muted); white-space: nowrap; }
.mini-list li span:first-child { min-width: 0; overflow-wrap: anywhere; }
.acard.ok { background: var(--mint); border-color: transparent; }
.acard.ok .cap { color: var(--mint-ink); }
.acard.watch { background: var(--amber-bg); border-color: transparent; }
.acard.watch .cap { color: var(--amber-ink); }
.acard.urgent { background: var(--red-bg); border-color: transparent; }
.acard.urgent .cap { color: var(--red-ink); }
.acard h2 { font-size: 20px; font-weight: 800; margin-top: 6px; }
.acard p { margin-top: 6px; font-size: 14px; }
.acard .link { display: inline-block; margin-top: 10px; }

/* logs */
.lgrid { display: grid; gap: 16px; }
.lgrid > * { min-width: 0; }
@media (min-width: 900px) { .lgrid { grid-template-columns: minmax(0, .85fr) minmax(0, 1.5fr); align-items: start; } }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-top: 12px; }
.chips button { padding: 7px 14px; border-radius: 999px; background: var(--soft); font-weight: 700; font-size: 13px; white-space: nowrap; }
.chips button[aria-pressed="true"] { background: var(--pink); color: var(--on-pink); }
.tscroll { overflow-x: auto; margin-top: 8px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 400px; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 8px; }
.tbl td { padding: 11px 8px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl td:nth-child(2) { font-weight: 700; }
.tbl td:nth-child(3) { overflow-wrap: anywhere; }
.tbl td:last-child { text-align: right; }
.empty { color: var(--muted); padding: 18px 0 6px; }
.formgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.addgrid { display: grid; gap: 16px; }
.addgrid > * { min-width: 0; }
@media (min-width: 900px) { .addgrid { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: stretch; } }
.sidepanel { border-radius: 16px; padding: 28px; background: linear-gradient(150deg, var(--g1) 0%, var(--g2) 55%, var(--g3) 100%); color: #26224C; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
.sidepanel h2 { font-size: 22px; font-weight: 800; }

/* appointments */
.alist { display: flex; flex-direction: column; gap: 12px; }
.appt { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.appt.past { opacity: .65; box-shadow: none; }
.dbadge { width: 56px; height: 56px; border-radius: 14px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; line-height: 1.05; flex: none; background: var(--c); }
.dbadge small { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.dbadge b { font-size: 20px; }
.c0 { --c: #D1346F; } .c1 { --c: #7A4FD0; } .c2 { --c: #168A78; }
.ainfo { flex: 1 1 200px; min-width: 0; }
.ainfo h3 { font-size: 15px; }
.ainfo p { color: var(--muted); font-size: 13.5px; overflow-wrap: anywhere; }
.aact { display: flex; gap: 16px; }
.resched { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.resched .field { flex: 1 1 150px; }

/* tips */
.wtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.wtabs button { padding: 9px 18px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 14px; white-space: nowrap; }
.wtabs button[aria-pressed="true"] { background: var(--pink); color: var(--on-pink); border-color: var(--pink); }
.tgrid { display: grid; gap: 16px; }
.tgrid > * { min-width: 0; }
@media (min-width: 900px) { .tgrid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }
.tgrad .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 4.4vw, 40px); line-height: 1.1; margin-top: 6px; text-transform: capitalize; }
.tgrad p { margin-top: 10px; font-size: 14.5px; }
.tgrad .meta { font-size: 13px; font-weight: 700; opacity: .9; }
.ul { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.ul li { position: relative; padding-left: 18px; font-size: 14.5px; }
.ul li::before { content: ''; position: absolute; left: 0; top: .6em; width: 7px; height: 7px; border-radius: 50%; background: var(--pink); }
.mint { background: var(--mint); border-color: transparent; }
.mint h3 { color: var(--mint-ink); }

/* alerts page */
.arow { display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; }
.arow.urgent { background: var(--red-bg); color: var(--red-ink); }
.arow.watch { background: var(--amber-bg); color: var(--amber-ink); }
.arow.info { background: var(--soft); }
.arow h3 { font-size: 15px; }
.arow p { font-size: 14px; margin-top: 2px; }

/* profile */
.pgrid { display: grid; gap: 16px; }
.pgrid > * { min-width: 0; }
@media (min-width: 900px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; } }
.kv { display: flex; flex-direction: column; margin-top: 8px; }
.kv > div { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 14px; padding: 11px 0; border-top: 1px solid var(--line); }
.kv > div:first-child { border-top: 0; }
.kv dt { color: var(--muted); font-size: 13px; font-weight: 600; }
.kv dd { margin: 0; font-weight: 700; text-align: right; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* family */
.ftop { background: var(--navy); color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 16px clamp(16px, 4vw, 36px); }

/* ---------- daily log, cycle engine, charts ---------- */
const SYMS = ['Cramps', 'Headache', 'Bloating', 'Fatigue', 'Cravings', 'Acne', 'Backache', 'Tender breasts'];
const PSYMS = ['Nausea', 'Heartburn', 'Back pain', 'Fatigue', 'Swelling', 'Headache', 'Cravings', 'Leg cramps'];

const MOODS = ['Radiant', 'Calm', 'Low', 'Irritable', 'Anxious'];
const ACTS = [['prot', 'Protected sex'], ['unprot', 'Unprotected sex'], ['oral', 'Oral sex'], ['anal', 'Anal sex'], ['solo', 'Masturbation'], ['org', 'Orgasm'], ['oth', 'Other']];

const TAG_IDS = TAGS.map(a => a[0]);
const TAG_EXCL = { ovp: 'ovn', ovn: 'ovp', ptp: 'ptn', ptn: 'ptp' };
const FLOW = [{ k: 0, l: 'None' }, { k: 1, l: 'Spotting' }, { k: 2, l: 'Light' }, { k: 3, l: 'Medium' }, { k: 4, l: 'Heavy' }];
const FLOW_AX = ['', 'Spot', 'Light', 'Med', 'Heavy'];
const DROP = 'M12 2.6c3.7 4.5 6.1 7.8 6.1 11.1a6.1 6.1 0 0 1-12.2 0C5.9 10.4 8.3 7.1 12 2.6z';
const HEART = 'M12 20.5s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.8a4.3 4.3 0 0 1 7.5 2.7c0 5.4-7.5 10-7.5 10z';
const PH = {
  men: { name: 'Menstrual', v: '--pink', tip: 'Bleeding days. Warmth, rest and iron-rich food are common comforts. Logging flow each day sharpens your predictions.' },
  fol: { name: 'Follicular', v: '--teal', tip: 'Estrogen climbs and energy often rises. Many people find this a good stretch for harder workouts and new projects.' },
  ovu: { name: 'Ovulation', v: '--amber', tip: 'An egg is released around now, and cervical fluid is often clearer and stretchier. This is the peak of the fertile window.' },
  lut: { name: 'Luteal', v: '--violet', tip: 'Progesterone rises. Bloating, cravings and tender breasts show up for many people in the week before a period.' }
};
const PH_ORDER = ['men', 'fol', 'ovu', 'lut'];
const clampI = (n, a, b) => { n = Number(n); if (!isFinite(n)) return a; return Math.min(b, Math.max(a, Math.round(n))); };
const nnum = (x, lo, hi) => { if (x === null || x === '' || x === undefined) return null; const n = Number(x); return isFinite(n) && n >= lo && n <= hi ? n : null; };
const keepIn = (a, list) => (Array.isArray(a) ? a : []).filter((v, i, s) => list.includes(v) && s.indexOf(v) === i);
const uniqSort = a => a.filter((v, i) => a.indexOf(v) === i).sort();
const defaultPrefs = () => ({ tu: 'C', wu: 'kg', discreet: false, heads: true, contra: 'none' });
const normPrefs = p => { p = p && typeof p === 'object' ? p : {}; return { tu: p.tu === 'F' ? 'F' : 'C', wu: p.wu === 'lb' ? 'lb' : 'kg', discreet: p.discreet === true, heads: p.heads !== false, contra: ['none', 'pill', 'condom', 'iud', 'other'].includes(p.contra) ? p.contra : 'none' }; };
const cleanDay = e => {
  e = e && typeof e === 'object' ? e : {};
  return {
    flow: clampI(e.flow || 0, 0, 4), sx: keepIn(e.sx, ALL_SYMS), mood: MOODS.includes(e.mood) ? e.mood : '',
    note: typeof e.note === 'string' ? e.note.slice(0, 500) : '', act: keepIn(e.act, ACT_IDS), drive: DRIVES.includes(e.drive) ? e.drive : '',
    tags: keepIn(e.tags, TAG_IDS), bbt: nnum(e.bbt, 34, 42), weight: nnum(e.weight, 20, 400), water: clampI(e.water || 0, 0, 20), sleep: nnum(e.sleep, 0, 24)
  };
};
const isEmptyDay = e => !e.flow && !e.sx.length && !e.mood && !e.note.trim() && !e.act.length && !e.drive && !e.tags.length && e.bbt == null && e.weight == null && !e.water && e.sleep == null;
const dayEntry = (u, k) => cleanDay(u.days && u.days[k]);
const saveDay = (u, k, e) => { if (!u.days) u.days = {}; if (isEmptyDay(e)) delete u.days[k]; else u.days[k] = e; save(); };
const normUser = u => {
  if (!u || typeof u !== 'object') return null;
  u.name = String(u.name || 'Friend').slice(0, 40);
  u.logs = (Array.isArray(u.logs) ? u.logs : []).filter(l => l && validDate(l.date) && LOG_TYPES[l.type] && l.value !== undefined);
  u.appts = (Array.isArray(u.appts) ? u.appts : []).filter(a => a && validDate(a.date) && /^\d{2}:\d{2}$/.test(a.time || ''));
  u.prefs = normPrefs(u.prefs);

  if (u.role === 'family') return u;
  u.role = 'mother';
  u.mode = u.mode === 'cycle' ? 'cycle' : 'pregnant';
  const days = {};
  if (u.days && typeof u.days === 'object') Object.keys(u.days).forEach(k => { if (validDate(k)) { const e = cleanDay(u.days[k]); if (!isEmptyDay(e)) days[k] = e; } });
  u.days = days;
  if (u.mode === 'cycle') {
    if (!validDate(u.lastStart)) return null;

    u.starts = uniqSort((Array.isArray(u.starts) ? u.starts : []).filter(s => typeof s === 'string' && validDate(s) && s <= u.lastStart).concat([u.lastStart]));

};

/* cycle engine (per user) */
const cparams = u => { const L = u.cycle, P = Math.min(u.period, L - 10); return { L, P, ov: Math.max(L - 14, P + 3) }; };
const cday = (u, k) => { const L = u.cycle, diff = dnum(k) - dnum(u.lastStart); return ((diff % L) + L) % L + 1; };

const applyTheme = () => { const t = getTheme(); if (t === 'auto') { if (THEME0) document.documentElement.setAttribute('data-theme', THEME0); else document.documentElement.removeAttribute('data-theme'); } else document.documentElement.setAttribute('data-theme', t); };

const streakOf = u => { let n = 0, k = today(); if (!u.days[k]) k = add(k, -1); while (u.days[k]) { n++; k = add(k, -1); } return n; };
const checkinHTML = u => {
  const t = today(), e = dayEntry(u, t), st = streakOf(u), wk = [];
  for (let i = 6; i >= 0; i--) wk.push(add(t, -i));
  const logged = wk.filter(k => u.days[k]).length, mc = {};
  wk.forEach(k => { const m = u.days[k] && u.days[k].mood; if (m) mc[m] = (mc[m] || 0) + 1; });
  const tm = Object.keys(mc).sort((a, b) => mc[b] - mc[a])[0];
  return `<div class="card-head"><h2>Today&rsquo;s check-in</h2><span class="streak">${st ? st + '-day streak' : 'Start a streak'}</span></div>
    <div class="ckgrid">
      <div><p class="sublabel">How are you feeling?</p><div class="cchips" style="margin-top:8px">${MOODS.map(m => chip('qk-mood', m, m, e.mood === m, '')).join('')}</div></div>
      <div><p class="sublabel">Water</p><div class="stepper" role="group" aria-label="Water today" style="margin-top:8px"><button type="button" class="icon-btn" data-act="qk-water-" aria-label="One glass less"${e.water <= 0 ? ' disabled' : ''}>&minus;</button><output aria-live="polite">${e.water} ${e.water === 1 ? 'glass' : 'glasses'}</output><button type="button" class="icon-btn" data-act="qk-water+" aria-label="One glass more"${e.water >= 20 ? ' disabled' : ''}>+</button></div></div>
      <div><p class="sublabel">This week &middot; ${logged} of 7 days logged${tm ? ' &middot; mostly ' + tm.toLowerCase() : ''}</p><div class="wdots" role="img" aria-label="${logged} of the last 7 days logged">${wk.map(k => `<span><i class="${u.days[k] ? 'on' : ''}"></i>${fmt(k, { weekday: 'narrow' })}</span>`).join('')}</div></div>
      <div><button class="btn soft" data-act="log-today">Open full day log</button></div>
    </div>`;
};
const regularity = u => {
  const lens = lensList(u);
  if (lens.length < 3) return { label: 'Log more periods', warn: false, note: 'Log the first day of at least four periods to see how regular your cycle is.' };
  const v = lens.map(x => x.len), range = Math.max(...v) - Math.min(...v);
  if (range <= 4) return { label: 'Very regular', warn: false, note: `Your last ${v.length} cycles varied by only ${range} days.` };
  if (range <= 7) return { label: 'Regular', warn: false, note: `Your last ${v.length} cycles varied by ${range} days, which is within the usual range.` };
  return { label: 'Varies a lot', warn: true, note: `Your last ${v.length} cycles varied by ${range} days. Large swings can have many causes, so mention it at your next checkup.` };
};
const predictHTML = u => {
  const q = cparams(u), t = today(), d = cday(u, t), first0 = add(t, q.L - d + 1), r = regularity(u), rows = [];
  for (let i = 0; i < 3; i++) { const s0 = add(first0, i * q.L), ov = add(s0, q.ov - 1); rows.push([s0, add(ov, -5), add(ov, 1), ov]); }
  return `<h2>Next 3 cycles</h2><p class="muted" style="font-size:13px;margin-top:2px">Estimates from a ${q.L} day cycle. They shift as you log.</p>
    <ul class="clist">${rows.map(x => `<li><span><b>Period</b> ${fmt(x[0], SHORT)}</span><span>Fertile ${fmt(x[1], MD)} to ${fmt(x[2], MD)}<br>Ovulation ${fmt(x[3], MD)}</span></li>`).join('')}</ul>
    <p style="margin-top:14px"><span class="badge${r.warn ? ' warn' : ''}">${r.label}</span></p><p class="para" style="margin-top:8px">${r.note}</p>`;
};

/* baby tools */
const T = { kick: null, con: { start: null, list: [] } };
const mmss = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const clock = ms => new Date(ms).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const conSummary = () => {
  const hr = T.con.list.filter(c => Date.now() - c.s <= 3600000);
  if (hr.length < 4) return '';
  const iv = []; for (let i = 0; i < hr.length - 1; i++) iv.push(hr[i].s - hr[i + 1].s);
  const avgI = iv.reduce((a, b) => a + b, 0) / iv.length, avgD = hr.reduce((a, c) => a + (c.e - c.s), 0) / hr.length;
  const hit = avgI <= 300000 && avgD >= 55000 && hr.length >= 6;
  return `<p class="${hit ? 'privnote' : 'para'}" style="margin-top:12px">${hit ? 'Your last hour matches the common 5-1-1 guide: about every 5 minutes, lasting about a minute, for an hour. Call your care provider or go to your birth place now.' : `Last hour: ${hr.length} contractions, about ${mmss(avgI)} apart, lasting about ${mmss(avgD)} each.`}</p>`;
};
const toolsView = () => {

    <div class="insgrid">
      <section class="card org" id="kickCard"><h2>Kick counter</h2>

        <p class="msg" id="kMsg" role="status" style="margin-top:10px"></p>

      <section class="card org" id="conCard"><h2>Contraction timer</h2>

        <div class="bigcount"><b id="cT">${c.start ? mmss(Date.now() - c.start) : '0:00'}</b><span class="cap muted">${c.start ? 'contraction running' : 'ready'}</span></div>

        ${rows.length ? `<ul class="clist">${rows.map((x, i) => { const nx = c.list[i + 1]; return `<li><span>${clock(x.s)} &middot; lasted ${mmss(x.e - x.s)}</span><span>${nx ? mmss(x.s - nx.s) + ' since last' : 'first'}</span></li>`; }).join('')}</ul>` : ''}
        ${conSummary()}

const tickTools = () => {

/* doctor summary */
const topSyms = (u, n) => { const c = {}; Object.keys(u.days).forEach(k => { if (dnum(today()) - dnum(k) <= 90) u.days[k].sx.forEach(s => { c[s] = (c[s] || 0) + 1; }); }); return Object.keys(c).sort((a, b) => c[b] - c[a]).slice(0, n).map(s => `${s} (${c[s]} days)`); };
const reportHTML = u => {
  const cyc = u.mode === 'cycle', t = today(); let body = '';
  if (cyc) {
    const q = cparams(u), lens = lensList(u), avg = lens.length ? (lens.reduce((a, x) => a + x.len, 0) / lens.length).toFixed(1) : 'not enough data', d = cday(u, t);
    body += `<h2>Cycle</h2><table><tr><th>Last period started</th><td>${fmt(u.lastStart, LONGD)}</td></tr><tr><th>Usual cycle / period length</th><td>${q.L} days / ${q.P} days</td></tr><tr><th>Average of recent cycles</th><td>${avg}${lens.length ? ' days (' + lens.length + ' cycles)' : ''}</td></tr><tr><th>Today</th><td>Cycle day ${d}, ${PH[phaseOf(u, d)].name} phase</td></tr><tr><th>Next period expected</th><td>${fmt(add(t, q.L - d + 1), LONGD)}</td></tr></table>`;
    if (lens.length) body += `<h2>Recent cycle lengths</h2><p>${lens.map(x => fmt(x.start, MD) + ': ' + x.len + ' days').join(' &middot; ')}</p>`;
  } else {
    const p = preg(u.lmp), w = u.logs.filter(l => l.type === 'weight').sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5), bp = u.logs.filter(l => l.type === 'bp').sort((a, b) => b.date.localeCompare(a.date)).slice(0, 5);
    body += `<h2>Pregnancy</h2><table><tr><th>Last menstrual period</th><td>${fmt(u.lmp, LONGD)}</td></tr><tr><th>Due date</th><td>${fmt(p.due, LONGD)}</td></tr><tr><th>Current week</th><td>Week ${p.week}, ${TRI[p.tri]}</td></tr></table>`;
    if (w.length) body += `<h2>Recent weight</h2><p>${w.map(l => fmt(l.date, MD) + ': ' + l.value + ' kg').join(' &middot; ')}</p>`;
    if (bp.length) body += `<h2>Recent blood pressure</h2><p>${bp.map(l => fmt(l.date, MD) + ': ' + esc(l.value)).join(' &middot; ')}</p>`;
    const ap = u.appts.filter(a => a.date >= t).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);

  return `<h1>G SPOT health summary</h1><p>${esc(u.name)} &middot; printed ${fmt(t, LONGD)}</p>${body}<p class="fine">Prepared from information the user entered in G SPOT. It is general tracking data, not a medical record or medical advice.</p>`;
};

const VIEWS = {
  dashboard: () => me().mode === 'cycle' ? cycDash() : pregDash(), calendar: calView, insights: () => me().mode === 'cycle' ? cycInsights() : pregInsights(),
  body: bodyView, tools: toolsView, learn: learnView, profile: profileView, logs: logsView, add: addView, appts: apptsView, tips: tipsView, alerts: alertsView
};
const allowed = u => NAV[u.mode].map(i => i[0]).concat(u.mode === 'pregnant' ? ['add', 'family'] : []);

/* ---------- rendering ---------- */
const render = animate => {
  const u = me(); let html;
  if (!u) {
    if (!['landing', 'login', 'register'].includes(route)) route = 'landing';
    html = route === 'login' ? loginView() : route === 'register' ? registerView() : landing();
  } else if (u.role === 'family') { route = 'family'; html = familyView(u, false); }
  else {
    if (!allowed(u).includes(route)) route = 'dashboard';
    html = route === 'family' ? familyView(u, true) : VIEWS[route]();
  }
  const y = window.scrollY;
  root.innerHTML = html;
  if (animate) { window.scrollTo(0, 0); organize(); } else window.scrollTo(0, y);
  if (u && u.prefs) $$('select[data-pref]', root).forEach(sl => { sl.value = u.prefs[sl.dataset.pref]; });
  { const th = $('#selTheme'); if (th) th.value = getTheme(); }
  if (ui.focus) { const n = $(ui.focus); if (n) n.focus(); ui.focus = null; }
  if (ui.flash) { const s = $('#saved'); if (s) s.textContent = ui.flash; ui.flash = ''; }
};
const go = r => { route = r; ui.resched = null; if (r !== 'appts') ui.addAppt = false; if (r === 'body') ui.sel = today(); ui.revealed = false; render(true); };

/* panels organize into place */
const REDUCE = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const pr = (i, n) => { const x = Math.sin(i * 97.13 + n * 31.7) * 10000; return x - Math.floor(x); };
function organize() {
  if (REDUCE || !Element.prototype.animate || (splashUp)) return;
  $$('#root .org').forEach((el, i) => {
    if (!el.getClientRects().length) return;
    const dx = (pr(i, 1) - 0.5) * 70, dy = 30 + pr(i, 2) * 46, rot = (pr(i, 3) - 0.5) * 8;
    el.animate([
      { opacity: 0, transform: `translate(${dx.toFixed(1)}px,${dy.toFixed(1)}px) rotate(${rot.toFixed(2)}deg) scale(.92)` },
      { opacity: 1, transform: 'none' }
    ], { duration: 700, delay: 40 + i * 70, easing: 'cubic-bezier(.2,.9,.25,1)', fill: 'backwards' });
  });
}

/* ---------- toast ---------- */
let toastTimer;
const toast = (msg, undo) => {
  const t = $('#toast'); clearTimeout(toastTimer);
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undoBtn">Undo</button>' : ''}`;
  t.hidden = false;
  if (undo) $('#undoBtn').onclick = () => { undo(); t.hidden = true; };
  toastTimer = setTimeout(() => { t.hidden = true; }, 5000);
};

/* ---------- form helpers ---------- */
const showErr = (f, name, msg) => {
  const e = $(`[data-err="${name}"]`, f), i = f.elements[name];
  if (e) { e.textContent = msg || ''; e.hidden = !msg; }
  if (i && i.classList) i.classList.toggle('invalid', !!msg);
  if (i && i.setAttribute) { if (msg) i.setAttribute('aria-invalid', 'true'); else i.removeAttribute('aria-invalid'); }
};
const clearErrs = f => $$('[data-err]', f).forEach(e => showErr(f, e.getAttribute('data-err'), ''));
const firstInvalid = f => { const i = $('.invalid', f); if (i) i.focus(); };

const handlers = {
  login(f) {
    clearErrs(f);
    const un = f.username.value.trim().toLowerCase(), pw = f.password.value; let bad = false;
    const u = DB.users[un];
    if (!un) { showErr(f, 'username', 'Error: please enter your username.'); bad = true; }
    else if (!u) { showErr(f, 'username', 'Error: that username was not found.'); bad = true; }
    if (!pw) { showErr(f, 'password', 'Error: please enter your password.'); bad = true; }
    else if (u && u.hash !== hashPw(pw)) { showErr(f, 'password', 'Error: that password is not right.'); bad = true; }
    if (bad) return firstInvalid(f);
    DB.session = un; save(); route = 'dashboard'; render(true);
  },
  register(f) {
    clearErrs(f);
    const role = f.role.value, name = f.name.value.trim(), un = f.username.value.trim().toLowerCase(), pw = f.password.value; let bad = false;
    if (!name) { showErr(f, 'name', 'Error: please enter your name.'); bad = true; }
    if (!/^[a-z0-9_]{3,20}$/.test(un)) { showErr(f, 'username', 'Error: use 3 to 20 letters, numbers or underscores.'); bad = true; }
    else if (DB.users[un]) { showErr(f, 'username', 'Error: that username is taken.'); bad = true; }
    if (pw.length < 6) { showErr(f, 'password', 'Error: the password needs at least 6 characters.'); bad = true; }
    const base = { name, hash: hashPw(pw), logs: [], appts: [], days: {}, prefs: defaultPrefs(), pin: null };
    let user = null;
    if (role === 'cycle') {
      const cs = f.cstart.value, ce = V.date(cs), cl = num(f.clen.value), pl = num(f.plen.value);
      if (ce) { showErr(f, 'cstart', ce); bad = true; } else if (dnum(today()) - dnum(cs) > 120) { showErr(f, 'cstart', 'Error: that is more than 4 months ago. Enter your most recent period.'); bad = true; }
      if (isNaN(cl) || cl < 21 || cl > 45 || cl % 1) { showErr(f, 'clen', 'Error: enter 21 to 45 days.'); bad = true; }
      if (isNaN(pl) || pl < 2 || pl > 10 || pl % 1) { showErr(f, 'plen', 'Error: enter 2 to 10 days.'); bad = true; }
      if (!bad) user = Object.assign(base, { role: 'mother', mode: 'cycle', lastStart: cs, starts: [cs], cycle: cl, period: pl, lmp: '' });
    } else if (role === 'mother') {
      const lmp = f.lmp.value, e = V.lmp(lmp);
      if (e) { showErr(f, 'lmp', e); bad = true; }
      if (!bad) user = Object.assign(base, { role: 'mother', mode: 'pregnant', lmp });
    } else {
      const fo = f.follows.value.trim().toLowerCase();
      if (!DB.users[fo] || DB.users[fo].role !== 'mother' || DB.users[fo].mode !== 'pregnant') { showErr(f, 'follows', 'Error: no expecting mother has that username.'); bad = true; }
      if (!bad) user = Object.assign(base, { role: 'family', mode: 'pregnant', follows: fo });
    }
    if (bad) return firstInvalid(f);
    DB.users[un] = user; DB.session = un; save(); route = 'dashboard'; render(true); toast('Welcome to G SPOT');
  },
  quicklog(f) {
    clearErrs(f);
    const type = f.type.value, v = f.value.value.trim(), e = V[type](v);
    if (e) { showErr(f, 'value', e); return firstInvalid(f); }
    me().logs.push({ id: uid(), date: today(), type, value: norm(type, v) }); save(); render(false); toast('Log saved');
  },
  addlog(f) {
    clearErrs(f);
    const u = me(), date = f.date.value; let bad = false;
    const e0 = V.date(date); if (e0) { showErr(f, 'date', e0); bad = true; }
    const fields = ['weight', 'bp', 'water', 'kicks', 'symptom'], entries = [];
    fields.forEach(n => { const v = f[n].value.trim(); if (v === '') return; const e = V[n](v); if (e) { showErr(f, n, e); bad = true; } else entries.push({ id: uid(), date, type: n, value: norm(n, v) }); });
    if (!bad && !entries.length) { showErr(f, 'form', 'Error: fill in at least one field to save a log.'); bad = true; }
    if (bad) return firstInvalid(f);
    entries.forEach(x => u.logs.push(x)); save(); go('logs'); toast(`${plural(entries.length, 'log')} saved`);
  },
  appt(f) {
    clearErrs(f);
    const title = f.title.value.trim(), date = f.date.value, time = f.time.value; let bad = false;
    if (!title) { showErr(f, 'title', 'Error: please enter a title.'); bad = true; }
    if (!validDate(date)) { showErr(f, 'date', 'Error: please enter a valid date.'); bad = true; }
    else if (date < today()) { showErr(f, 'date', 'Error: pick today or a future date.'); bad = true; }
    if (!/^\d{2}:\d{2}$/.test(time)) { showErr(f, 'time', 'Error: please pick a time.'); bad = true; }
    if (bad) return firstInvalid(f);
    me().appts.push({ id: uid(), title, date, time, who: f.who.value.trim(), note: f.note.value.trim() }); ui.addAppt = false; save(); render(false); toast('Appointment saved');
  },
  resched(f) {
    clearErrs(f);
    const a = me().appts.find(x => x.id === f.getAttribute('data-id')), date = f.date.value, time = f.time.value; let bad = false;
    if (!validDate(date)) { showErr(f, 'date', 'Error: please enter a valid date.'); bad = true; }
    else if (date < today()) { showErr(f, 'date', 'Error: pick today or a future date.'); bad = true; }
    if (!/^\d{2}:\d{2}$/.test(time)) { showErr(f, 'time', 'Error: please pick a time.'); bad = true; }
    if (bad || !a) return firstInvalid(f);
    a.date = date; a.time = time; ui.resched = null; save(); render(false); toast('Appointment rescheduled');
  },
  lmp(f) {
    clearErrs(f);
    const v = f.lmp.value, e = V.lmp(v);
    if (e) { showErr(f, 'lmp', e); return firstInvalid(f); }
    me().lmp = v; save(); render(false); toast('Due date updated');
  },
  cycleset(f) {
    clearErrs(f);
    const u = me(), ls = f.lastStart.value, cl = num(f.cycle.value), pl = num(f.period.value); let bad = false;
    const e = V.date(ls); if (e) { showErr(f, 'lastStart', e); bad = true; }
    if (isNaN(cl) || cl < 21 || cl > 45 || cl % 1) { showErr(f, 'cycle', 'Error: cycle length must be 21 to 45 days.'); bad = true; }
    if (isNaN(pl) || pl < 2 || pl > 10 || pl % 1) { showErr(f, 'period', 'Error: period length must be 2 to 10 days.'); bad = true; }
    if (bad) return firstInvalid(f);
    u.starts = uniqSort(u.starts.filter(s => s < ls).concat([ls])); u.lastStart = ls; u.cycle = cl; u.period = pl;
    save(); render(false); toast('Cycle saved');
  },
  topreg(f) {
    clearErrs(f);
    const v = f.lmp.value, e = V.lmp(v);
    if (e) { showErr(f, 'lmp', e); return firstInvalid(f); }
    const u = me(); u.mode = 'pregnant'; u.lmp = v; save(); route = 'dashboard'; render(true); toast('Switched to pregnancy tracking');
  },
  tocycle(f) {
    clearErrs(f);
    const v = f.lastStart.value, e = V.date(v);
    if (e) { showErr(f, 'lastStart', e); return firstInvalid(f); }
    const u = me(); u.mode = 'cycle'; u.lastStart = v; u.starts = [v]; u.cycle = clampI(u.cycle || 28, 21, 45); u.period = clampI(u.period || 5, 2, 10);
    save(); route = 'dashboard'; render(true); toast('Switched to cycle tracking');
  }
};


/* ---------- events ---------- */

  const f = e.target.closest('form[data-form]'); if (!f) return;
  e.preventDefault(); handlers[f.getAttribute('data-form')](f);
});
root.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'role') $$('[data-role]', root).forEach(el => { el.hidden = el.getAttribute('data-role') !== t.value; });
  if (t.id === 'qt') {
    const v = $('#qv'), ph = { weight: ['Weight (kg)', 'decimal'], bp: ['Blood pressure (110/70)', 'text'], symptom: ['Symptom (e.g. mild back pain)', 'text'], water: ['Glasses of water', 'numeric'], kicks: ['Number of kicks', 'numeric'] }[t.value];
    v.placeholder = ph[0]; v.setAttribute('inputmode', ph[1]); v.value = ''; showErr(t.form, 'value', '');
  }
  if (t.id === 'selTheme') { setTheme(t.value); return; }
  if (t.dataset.pref) {
    const u = me(), k = t.dataset.pref;
    u.prefs[k] = (k === 'discreet' || k === 'heads') ? t.checked : t.value;

root.addEventListener('input', e => {
  const t = e.target, u = me();
  if (!u) return;

  if (t.id === 'note') { const en = dayEntry(u, ui.sel); en.note = t.value; saveDay(u, ui.sel, en); const s = $('#saved'); if (s) s.textContent = 'Saved'; return; }
  const which = { inBbt: 'bbt', inWeight: 'wt', inSleep: 'sleep' }[t.id];

});
const bodyMsg = (t, err) => { const m = $('#bodyMsg'); if (m) { m.className = 'msg' + (err ? ' err' : ''); m.textContent = t; } };
const onBodyInput = (u, which, raw) => {
  const e = dayEntry(u, ui.sel), v = raw === '' ? null : Number(raw);
  if (which === 'bbt') {
    const c = v == null ? null : fromT(u, v);

    e.bbt = c == null ? null : r2(c);

  const c = bodyCharts(u); $('#bbtChart').innerHTML = c.bbt; $('#wtChart').innerHTML = c.wt; $('#waterBars').innerHTML = c.water; $('#sleepBars').innerHTML = c.sleep;
};
const startOfMonth = k => { const d = parse(k); return new Date(d.getFullYear(), d.getMonth(), 1); };
const dayAct = (act, v, u) => {
  const k = ui.sel, e = dayEntry(u, k);

  else if (act === 'd-sx') { const i = e.sx.indexOf(v); if (i > -1) e.sx.splice(i, 1); else e.sx.push(v); }

};
root.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.go) return go(d.go);
  if (d.scroll) { const el = document.getElementById(d.scroll); if (el) el.scrollIntoView({ behavior: REDUCE ? 'auto' : 'smooth', block: 'start' }); return; }

  const u = me();
  if (d.act && d.act.indexOf('d-') === 0 && u && d.act !== 'd-reveal' && d.act !== 'd-start') return dayAct(d.act, d.v, u);
  switch (d.act) {
    case 'logout': DB.session = null; save(); ui.preview = false; route = 'landing'; render(true); break;
    case 'logout-register': DB.session = null; save(); route = 'register'; render(true); break;
    case 'demo-mother': seedDemo(); DB.session = 'maria'; save(); route = 'dashboard'; render(true); break;
    case 'demo-cycle': seedDemo(); DB.session = 'sam'; save(); route = 'dashboard'; render(true); break;
    case 'demo-family': seedDemo(); DB.session = 'partner'; save(); route = 'family'; render(true); break;
    case 'toggle-appt': ui.addAppt = !ui.addAppt; ui.resched = null; render(false); break;
    case 'resched': ui.resched = d.id; render(false); break;
    case 'resched-cancel': ui.resched = null; render(false); break;
    case 'del-log': { const i = u.logs.findIndex(l => l.id === d.id); if (i < 0) break; const [rm] = u.logs.splice(i, 1); save(); render(false); toast('Log deleted', () => { u.logs.splice(i, 0, rm); save(); render(false); }); break; }
    case 'del-appt': { const i = u.appts.findIndex(l => l.id === d.id); if (i < 0) break; const [rm] = u.appts.splice(i, 1); save(); render(false); toast('Appointment deleted', () => { u.appts.splice(i, 0, rm); save(); render(false); }); break; }
    case 'copy-user': {
      const done = () => toast('Username copied'), fail = () => toast('Select the username above to copy it');
      try { navigator.clipboard.writeText(DB.session).then(done, fail); } catch (er) { fail(); }
      break;
    }
    case 'preview-family': go('family'); break;
    /* calendar and day log */
    case 'pick-day': ui.sel = d.v; ui.revealed = false; render(false); break;
    case 'cal-prev': ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() - 1, 1); render(false); break;
    case 'cal-next': ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + 1, 1); render(false); break;
    case 'cal-today': ui.sel = today(); ui.month = startOfMonth(today()); render(false); break;

    case 'd-reveal': ui.revealed = true; render(false); break;
    case 'd-start': {

      save(); ui.flash = 'Period start saved'; render(false); toast(`Period start saved for ${fmt(ui.sel, MD)}`); break;
    }
    case 'use-avg': u.cycle = clampI(d.v, 21, 45); save(); render(false); toast(`Cycle length set to ${u.cycle} days`); break;
    /* body */
    case 'body-prev': ui.sel = add(ui.sel, -1); render(false); break;
    case 'body-next': if (dnum(ui.sel) < dnum(today())) { ui.sel = add(ui.sel, 1); render(false); } break;
    case 'water+': case 'water-': { const en = dayEntry(u, ui.sel); en.water = clampI(en.water + (d.act === 'water+' ? 1 : -1), 0, 20); saveDay(u, ui.sel, en); ui.focus = `[data-act="${d.act}"]:not(:disabled)`; render(false); break; }
    /* privacy and data */
    case 'qk-mood': { const en = dayEntry(u, today()); en.mood = en.mood === d.v ? '' : d.v; saveDay(u, today(), en); ui.focus = `[data-act="qk-mood"][data-v="${d.v}"]`; render(false); break; }
    case 'qk-water+': case 'qk-water-': { const en = dayEntry(u, today()); en.water = clampI(en.water + (d.act === 'qk-water+' ? 1 : -1), 0, 20); saveDay(u, today(), en); ui.focus = `[data-act="${d.act}"]:not(:disabled)`; render(false); break; }
    case 'kick-start': T.kick = { start: Date.now(), n: 0 }; ui.focus = '[data-act="kick-tap"]'; render(false); break;
    case 'kick-tap': if (T.kick) { T.kick.n++; $('#kN').textContent = T.kick.n; if (T.kick.n === 10) { const m = $('#kMsg'); m.className = 'msg'; m.textContent = `10 movements in ${mmss(Date.now() - T.kick.start)}. You can save the session now.`; } } break;
    case 'kick-save': if (T.kick) { const n = T.kick.n; if (n < 1) { const m = $('#kMsg'); m.className = 'msg err'; m.textContent = 'Tap at least once before saving.'; break; } u.logs.push({ id: uid(), date: today(), type: 'kicks', value: norm('kicks', String(n)) }); save(); T.kick = null; render(false); toast(`Saved ${plural(n, 'kick')} to your health logs`); } break;
    case 'kick-reset': T.kick = null; render(false); break;
    case 'con-toggle': if (T.con.start) { T.con.list.unshift({ s: T.con.start, e: Date.now() }); T.con.start = null; } else T.con.start = Date.now(); ui.focus = '[data-act="con-toggle"]'; render(false); break;
    case 'con-clear': T.con.list = []; T.con.start = null; render(false); break;
    case 'print-report': { const pa = $('#printarea'); pa.innerHTML = reportHTML(u); setTimeout(() => { try { window.print(); } catch (er) { toast('Printing is not available here'); } }, 50); break; }
    case 'lock-now': showLock(); break;
    case 'pin-on': {
      const p = $('#newPin').value, m = $('#pinMsg');
      if (!/^\d{4}$/.test(p)) { m.className = 'msg err'; m.textContent = 'The PIN must be exactly 4 digits.'; break; }

    }

/* ---------- lock ---------- */
const showLock = () => { root.hidden = true; $('#lock').hidden = false; $('#unlockPin').value = ''; $('#lockMsg').textContent = ''; setTimeout(() => $('#unlockPin').focus(), 0); };

/* ---------- splash ---------- */
let splashUp = false;
const runSplash = () => {
  const sp = $('#splash');
  if (!sp) return;
  if (REDUCE) { sp.hidden = true; return; }
  splashUp = true;
  let done = false; const timers = [];
  const finish = () => {
    if (done) return; done = true; timers.forEach(clearTimeout);
    sp.classList.add('out'); splashUp = false;
    setTimeout(organize, 120);
    setTimeout(() => { sp.hidden = true; }, 700);
  };
  ['Preparing your dashboard', 'Arranging your panels', 'Almost ready'].forEach((m, n) => timers.push(setTimeout(() => {
    const el = $('#spMsg'); el.textContent = m; el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap');
  }, n * 800)));
  timers.push(setTimeout(finish, 2500));
